<section id="projects" class="py-24 px-6 bg-navy-800 relative">

  <div class="max-w-6xl mx-auto">

    <!-- Título -->
    <div class="text-center mb-16">
      <span class="font-mono text-primary-400 text-sm">// projects.featured()</span>
      <h2 class="mt-3 text-3xl md:text-4xl font-bold text-white">
        {{ translations.title }}
      </h2>
      <div class="neon-line mt-6 max-w-xs mx-auto"></div>
    </div>

    <ng-container *ngIf="projects$ | async as projects">

      <!-- Lista de projetos -->
      <div
        *ngIf="projects.length > 0; else noProjects"
        class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"
      >
        <article
          *ngFor="let project of projects; trackBy: trackById"
          class="group relative bg-navy-900 rounded-xl border border-gray-800 overflow-hidden
                 hover:border-primary-500/40 hover:shadow-glow-card-hover
                 transition-all duration-300 hover:-translate-y-1 flex flex-col"
        >
          <!-- Linha superior neon -->
          <div class="h-px bg-gradient-to-r from-transparent via-primary-500/50 to-transparent"></div>

          <!-- Imagem -->
          <div class="relative overflow-hidden">
            <img
              [src]="project.image || 'assets/images/project-placeholder.jpg'"
              [alt]="project.title || 'Projeto'"
              class="w-full h-48 object-cover transition-transform duration-500 group-hover:scale-105 opacity-80 group-hover:opacity-100"
              loading="lazy"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-navy-900/80 to-transparent"></div>
          </div>

          <div class="p-6 flex flex-col flex-1">

            <!-- Título -->
            <h3 class="text-lg font-bold text-white mb-2 group-hover:text-primary-300 transition-colors">
              {{ getProjectTitle(project) }}
            </h3>

            <!-- Descrição -->
            <p class="text-gray-500 text-sm leading-relaxed mb-4 flex-1">
              {{ getProjectDescription(project) }}
            </p>

            <!-- Tecnologias -->
            <div *ngIf="project.technologies?.length" class="mb-5">
              <div class="flex flex-wrap gap-2">
                <span
                  *ngFor="let tech of project.technologies"
                  class="tech-tag text-xs"
                >
                  {{ tech }}
                </span>
              </div>
            </div>

            <!-- Badge sistema interno (sem links públicos) -->
            <div
              *ngIf="!project.links?.github && !project.links?.demo"
              class="mt-auto pt-4 border-t border-gray-800"
            >
              <span class="inline-flex items-center gap-1.5 text-xs font-mono text-gray-600 border border-gray-700 rounded-md px-2.5 py-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                {{ currentLanguage === 'pt' ? 'Uso Interno' : 'Internal Use' }}
              </span>
            </div>

            <!-- Links -->
            <div *ngIf="project.links?.github || project.links?.demo" class="flex gap-4 mt-auto pt-4 border-t border-gray-800">

              <a
                *ngIf="project.links?.github"
                [href]="project.links?.github"
                target="_blank"
                rel="noopener noreferrer"
                class="flex items-center gap-1.5 text-xs font-mono text-gray-400 hover:text-primary-400 transition-colors"
              >
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                </svg>
                {{ translations.viewCode }}
              </a>

              <a
                *ngIf="project.links?.demo"
                [href]="project.links?.demo"
                target="_blank"
                rel="noopener noreferrer"
                class="flex items-center gap-1.5 text-xs font-mono text-gray-400 hover:text-secondary-400 transition-colors"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
                {{ translations.viewProject }}
              </a>

            </div>
          </div>
        </article>
      </div>

      <!-- Sem projetos -->
      <ng-template #noProjects>
        <div class="text-center py-16 font-mono text-gray-600">
          <p>// no projects found</p>
        </div>
      </ng-template>

    </ng-container>
  </div>
</section>
