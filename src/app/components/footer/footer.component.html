<footer class="bg-navy-900 border-t border-gray-800 py-12 px-6">

  <div class="max-w-6xl mx-auto">

    <!-- Linha neon topo -->
    <div class="neon-line mb-10"></div>

    <div class="flex flex-col md:flex-row items-center justify-between gap-8">

      <!-- Logo / nome -->
      <div>
        <div class="font-mono text-lg font-bold mb-1">
          <span class="text-primary-400">&lt;</span>
          <span class="text-gray-200">VT</span>
          <span class="text-primary-400">/&gt;</span>
        </div>
        <p class="text-xs text-gray-600 font-mono">{{ name() }}</p>
      </div>

      <!-- Links de navegação -->
      <ul class="flex flex-wrap gap-x-6 gap-y-2 justify-center text-sm">
        <li><a href="#about"       class="text-gray-500 hover:text-primary-400 transition-colors font-mono text-xs">{{ aboutLabel() }}</a></li>
        <li><a href="#skills"      class="text-gray-500 hover:text-primary-400 transition-colors font-mono text-xs">{{ skillsLabel() }}</a></li>
        <li><a href="#projects"    class="text-gray-500 hover:text-primary-400 transition-colors font-mono text-xs">{{ projectsLabel() }}</a></li>
        <li><a href="#education"   class="text-gray-500 hover:text-primary-400 transition-colors font-mono text-xs">{{ educationLabel() }}</a></li>
        <li><a href="#professions" class="text-gray-500 hover:text-primary-400 transition-colors font-mono text-xs">{{ experienceLabel() }}</a></li>
        <li><a href="#problems"    class="text-gray-500 hover:text-primary-400 transition-colors font-mono text-xs">{{ casesLabel() }}</a></li>
      </ul>

      <!-- Copyright -->
      <p class="text-xs text-gray-500 font-mono text-center md:text-right">
        © {{ year }} {{ name() }}<br>
        <span class="text-gray-600">{{ rightsLabel() }}</span>
      </p>

    </div>

    <!-- Crédito -->
    <div class="mt-8 text-center">
      <p class="text-xs font-mono text-gray-600">
        built with <span class="text-primary-500">Angular</span> + <span class="text-secondary-500">Tailwind CSS</span>
      </p>
    </div>

  </div>
</footer>
