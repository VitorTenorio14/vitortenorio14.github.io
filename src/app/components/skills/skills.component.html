<section id="skills" class="py-24 px-6 bg-navy-900 relative">

  <div class="max-w-6xl mx-auto">

    <!-- Título -->
    <div class="text-center mb-16">
      <span class="font-mono text-primary-400 text-sm">// skills.map()</span>
      <h2 class="mt-3 text-3xl md:text-4xl font-bold text-white">
        {{ translations.skills.title }}
      </h2>
      <div class="neon-line mt-6 max-w-xs mx-auto"></div>
    </div>

    <ng-container *ngIf="skillsByCategory$ | async as skillsMap">
      <div class="space-y-14">

        <div *ngFor="let category of categories; trackBy: trackByCategory">

          <!-- Título da categoria -->
          <div class="flex items-center gap-4 mb-6">
            <h3 class="text-sm font-mono font-semibold text-primary-400 uppercase tracking-widest">
              {{ getCategoryLabel(category) }}
            </h3>
            <div class="flex-1 h-px bg-gradient-to-r from-primary-500/30 to-transparent"></div>
          </div>

          <!-- Grid de skills -->
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">

            <div
              *ngFor="let skill of skillsMap.get(category) ?? []; trackBy: trackByName"
              class="group relative bg-navy-800 rounded-xl p-4 border border-gray-800 text-center
                     hover:border-primary-500/50 hover:shadow-glow-card-hover hover:-translate-y-1
                     transition-all duration-300 cursor-default"
            >
              <!-- Glow no hover -->
              <div class="absolute inset-0 rounded-xl bg-primary-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>

              <!-- Ícone -->
              <div class="flex justify-center mb-3 relative z-10">
                <div class="w-12 h-12 flex items-center justify-center">
                  <img
                    [src]="getIconPath(skill.icon)"
                    [alt]="skill.name + ' icon'"
                    loading="lazy"
                    class="w-full h-full object-contain transition-transform duration-300 group-hover:scale-110"
                    (error)="onImageError($event, skill.icon)"
                  />
                </div>
              </div>

              <!-- Nome -->
              <span class="relative z-10 text-xs font-medium text-gray-400 group-hover:text-primary-300 transition-colors block">
                {{ skill.name }}
              </span>
            </div>

          </div>
        </div>

      </div>
    </ng-container>
  </div>
</section>
